name: Adding Reviewers

on:
  pull_request_review:
    types: [submitted]

jobs:
  add_reviewers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Add Reviewers
      run: |
        # If the PR description already has reviewers, append the new reviewer to the last line
        if [[ ${{ github.event.review.body }} =~ ^.*Reviewers:\ .*$ ]]; then
          # Append the reviewer to the last line
          pr_description="${{ github.event.review.body }}, ${{ github.event.user.name }} <${{ github.event.user.email }}>"
          gh edit pr ${{ github.event.pull_request.number }} --body "${{ pr_description }}"
          echo "pr_description: $pr_description"
        else
          # Add the reviewer to this new line
          pr_description="${pr_description}\n\nReviewers: ${{ github.event.user.name }} <${{ github.event.user.email }}>"
          gh edit pr ${{ github.event.pull_request.number }} --body "${{ pr_description }}"
          echo "pr_description: $pr_description"
        fi